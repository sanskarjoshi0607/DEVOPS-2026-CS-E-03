services:
  backend:
    build:
      context: ./backend
    container_name: quiz-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/quiz_portal
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
    container_name: quiz-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

  mongo:
    image: mongo:8
    container_name: quiz-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: