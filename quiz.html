<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f9;
      padding: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .quiz-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .quiz-card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .quiz-card:hover {
      transform: translateY(-8px);
    }

    .quiz-card h2 {
      margin-bottom: 10px;
    }

    .quiz-card p {
      color: #666;
      margin-bottom: 20px;
    }

    .quiz-card button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .quiz-card button:hover {
      background: #3730a3;
    }
  </style>
</head>

<body>

  <h1>Choose a Quiz</h1>

  <div class="quiz-container">

    <div class="quiz-card">
      <h2>HTML Quiz</h2>
      <p>Test your HTML knowledge with exciting questions.</p>
      <button>Start Quiz</button>
    </div>

    <div class="quiz-card">
      <h2>CSS Quiz</h2>
      <p>Check your CSS styling and design skills.</p>
      <button>Start Quiz</button>
    </div>

    <div class="quiz-card">
      <h2>JavaScript Quiz</h2>
      <p>Challenge yourself with JavaScript questions.</p>
      <button>Start Quiz</button>
    </div>

  </div>

</body>
</html>
